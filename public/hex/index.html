<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hex · SkyZero</title>
  <script>
    const mode = localStorage.getItem('skz_theme') || 'auto';
    document.documentElement.dataset.theme = mode === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
  </script>
  <link rel="stylesheet" href="/shared/base.css?v=20260907">
  <link rel="stylesheet" href="/hex/style.css?v=20261009">
  <script defer src="/hex/engine.js?v=20261009"></script>
  <script defer src="/hex/app.js?v=20261023"></script>
</head>
<body>
  <main class="hex-app">
    <header class="hex-header">
      <a href="/" class="brand-wm" aria-label="SkyZero home"><span class="bw-sky">Sky</span><span class="bw-zero">Zero</span></a>
      <div class="header-controls">
        <button id="language" type="button">EN</button>
        <select id="theme" aria-label="Theme"><option value="auto" data-i18n="auto">自动主题</option><option value="light" data-i18n="light">明亮</option><option value="dark" data-i18n="dark">暗黑</option></select>
      </div>
    </header>
    <div class="intro"><div><p class="eyebrow">ETAZERO V1.4</p><h1>Hex<span data-i18n="title">六角棋</span></h1></div><p data-i18n="subtitle">连起两边，赢下整盘。</p></div>
    <div class="game-layout">
      <section class="board-panel" aria-label="Hex board">
        <div class="board-heading"><div class="turn"><span id="turn-dot" class="stone black"></span><span id="status" role="status" aria-live="polite">加载模型…</span></div><span id="move-count">0</span></div>
        <div class="board-wrap"><svg id="board" role="group" aria-label="Hex board"></svg></div>
        <div class="board-footer"><span><i class="stone black"></i><span data-i18n="blackGoal">黑方连接上下</span></span><span><i class="stone white"></i><span data-i18n="whiteGoal">白方连接左右</span></span></div>
      </section>
      <aside class="settings-panel">
        <p class="eyebrow" data-i18n="opponent">你的对手</p><h2>EtaZero</h2>
        <label for="model" data-i18n="model">训练时长</label><select id="model" disabled></select>
        <p id="model-detail" class="model-detail"></p>
        <div class="settings-grid"><div><label for="size" data-i18n="size">棋盘大小</label><select id="size" disabled></select></div><div><label for="side" data-i18n="side">你的执色</label><select id="side"><option value="1" data-i18n="blackFirst">黑方 · 先手</option><option value="-1" data-i18n="whiteSecond">白方 · 后手</option></select></div></div>
        <label for="budget" data-i18n="budget">AI 思考时间</label><select id="budget"><option value="500">0.5 s</option><option value="1000">1 s</option><option value="3000" selected>3 s</option><option value="5000">5 s</option></select>
        <div class="actions"><button id="new-game" class="primary" type="button" data-i18n="newGame">新对局</button><button id="undo" type="button" disabled data-i18n="undo">悔棋</button></div>
        <button id="balanced-opening" class="opening-button" type="button" disabled data-i18n="balancedOpening">生成平衡开局</button>
        <p id="opening-info" class="opening-info" aria-live="polite"></p>
        <div class="search-info" id="search-info" aria-live="polite"></div>
        <div class="rules"><h3 data-i18n="howTo">怎么玩</h3><p data-i18n="rules">点击空格落子，将同色棋子连成一条连接目标两边的路径。黑方先手，白方后手，不设换边；桥形空点不算已连通。</p><p class="local" data-i18n="local">AI 在你的浏览器中运行。</p></div>
      </aside>
    </div>
  </main>
</body>
</html>
