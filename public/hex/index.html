<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hex · SkyZero</title>
  <script>
    const mode = localStorage.getItem('skz_theme') || 'auto';
    document.documentElement.dataset.theme = mode === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
  </script>
  <link rel="stylesheet" href="/shared/base.css?v=20260907">
  <link rel="stylesheet" href="/shared/board-game.css?v=20261102b">
  <link rel="stylesheet" href="/hex/style.css?v=20261102">
  <script defer src="/hex/engine.js?v=20261009"></script>
  <script defer src="/shared/board-game.js?v=20261102b"></script>
  <script defer src="/hex/app.js?v=20261102b"></script>
</head>
<body>
  <main class="app board-game-app">
    <header class="topbar game-topbar">
      <div class="game-brand-row">
        <a class="brand-title" href="/" aria-label="SkyZero home"><span class="brand-wm"><span class="bw-sky">Sky</span><span class="bw-zero">Zero</span></span><span class="brand-suffix"> · Hex</span></a>
        <div class="status-pill" id="status-pill"><span class="dot"></span><span id="status" role="status" aria-live="polite">加载模型…</span></div>
      </div>
      <div class="game-controls">
        <div class="control-group"><label for="model" data-i18n="model">训练时长</label><select id="model" disabled></select></div>
        <div class="control-group"><label for="size" data-i18n="size">棋盘大小</label><select id="size" disabled></select></div>
        <div class="control-group"><label for="side" data-i18n="side">你的执色</label><select id="side"><option value="1" data-i18n="blackFirst">黑方 · 先手</option><option value="-1" data-i18n="whiteSecond">白方 · 后手</option></select></div>
        <div class="control-group"><label for="budget" data-i18n="budget">AI 思考时间</label><select id="budget"><option value="500">0.5 s</option><option value="1000">1 s</option><option value="3000" selected>3 s</option><option value="5000">5 s</option></select></div>
        <div class="game-actions"><button id="new-game" class="btn primary" type="button" data-i18n="newGame">新对局</button><button id="undo" class="btn danger-ghost" type="button" disabled data-i18n="undo">悔棋</button></div>
      </div>
      <div class="header-controls"><button id="language" class="btn" type="button">EN</button><select id="theme" aria-label="Theme"><option value="auto" data-i18n="auto">自动主题</option><option value="light" data-i18n="light">明亮</option><option value="dark" data-i18n="dark">暗黑</option></select></div>
    </header>
    <div class="game-layout">
      <aside class="left-column">
        <div class="game-card chart-card">
          <div class="chart-heading"><span data-i18n="evaluation">AI 局面评估</span><strong id="evaluation-value">—</strong></div>
          <svg id="evaluation-chart" viewBox="0 0 280 180" preserveAspectRatio="none" role="img" aria-label="AI position estimate"></svg>
        </div>
        <div class="game-card stats-card">
          <div class="card-heading" data-i18n="gameStats">本局统计</div>
          <div class="stats-grid">
            <div class="stat"><span data-i18n="totalMoves">总手数</span><strong id="move-count">0</strong></div>
            <div class="stat"><span data-i18n="searchVisits">AI 搜索</span><strong id="search-visits">—</strong></div>
          </div>
        </div>
      </aside>
      <section class="board-panel" aria-label="Hex board">

        <div class="board-wrap"><svg id="board" role="group" aria-label="Hex board"></svg></div>
        <div class="board-footer"><span><i class="stone black"></i><span data-i18n="blackGoal">黑方连接上下</span></span><span><i class="stone white"></i><span data-i18n="whiteGoal">白方连接左右</span></span></div>
      </section>
      <aside class="right-column">
        <div class="game-card candidate-card">
          <div class="card-heading candidate-heading"><span data-i18n="candidates">候选着法</span><span data-i18n="candidateLegend">上次搜索 · 评估 · 访问</span></div>
          <div id="candidates" class="candidate-list"></div>
        </div>
        <div class="game-card info-panel">
        <div class="info-heading" data-i18n="gameInfo">对局信息</div>
        <p id="model-detail" class="model-detail"></p>
        <button id="balanced-opening" class="btn opening-button" type="button" disabled data-i18n="balancedOpening">生成平衡开局</button>
        <p id="opening-info" class="opening-info" aria-live="polite"></p>
        <div class="search-info" id="search-info" aria-live="polite"></div>
        <div class="rules"><h3 data-i18n="howTo">怎么玩</h3><p data-i18n="rules">点击空格落子，将同色棋子连成一条连接目标两边的路径。黑方先手，白方后手，不设换边；桥形空点不算已连通。</p><p class="local" data-i18n="local">AI 在你的浏览器中运行。</p></div>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
