<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中国象棋 · SkyZero</title>
  <script>
    const mode = localStorage.getItem('skz_theme') || 'auto';
    document.documentElement.dataset.theme = mode === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
  </script>
  <link rel="stylesheet" href="/shared/base.css?v=20260907">
  <link rel="stylesheet" href="/xiangqi/style.css?v=20261023">
  <script defer src="/xiangqi/app.js?v=20261023"></script>
</head>
<body>
  <main class="xiangqi-app">
    <header class="header">
      <a href="/" class="brand-wm" aria-label="SkyZero"><span class="bw-sky">Sky</span><span class="bw-zero">Zero</span></a>
      <div class="header-controls">
        <button id="language" type="button">EN</button>
        <select id="theme" aria-label="Theme"><option value="auto" data-i18n="auto">自动主题</option><option value="light" data-i18n="light">明亮</option><option value="dark" data-i18n="dark">暗黑</option></select>
      </div>
    </header>
    <div class="intro"><div><p class="eyebrow">ETAZERO V3</p><h1 data-i18n="title">中国象棋</h1></div><p data-i18n="subtitle">楚河汉界，一步见高下。</p></div>
    <div class="game-layout">
      <section class="board-panel" aria-label="Xiangqi board">
        <div class="board-heading"><div class="turn"><span id="turn-dot" class="turn-dot"></span><span id="status" role="status" aria-live="polite">加载模型…</span></div><span id="move-count">0</span></div>
        <div class="board-wrap"><svg id="board" viewBox="0 0 540 600" role="group" aria-label="中国象棋棋盘"></svg></div>
        <div class="board-footer"><span id="opponent-side"></span><span id="your-side"></span></div>
      </section>
      <aside class="settings-panel">
        <p class="eyebrow" data-i18n="opponent">你的对手</p><h2>EtaZero</h2>
        <p id="model-detail" class="model-detail"></p>
        <label for="side" data-i18n="side">你的执色</label><select id="side"><option value="1" data-i18n="redFirst">红方 · 先手</option><option value="-1" data-i18n="blackSecond">黑方 · 后手</option></select>
        <label for="budget" data-i18n="budget">AI 思考时间</label><select id="budget"><option value="500">0.5 s</option><option value="1000">1 s</option><option value="3000" selected>3 s</option><option value="5000">5 s</option></select>
        <div class="actions"><button id="new-game" class="primary" type="button" data-i18n="newGame">新对局</button><button id="undo" type="button" disabled data-i18n="undo">悔棋</button></div>
        <button id="retry" type="button" hidden data-i18n="retry">重试</button>
        <div id="search-info" class="search-info" aria-live="polite"></div>
        <div class="last-move"><span data-i18n="lastMove">上一手</span><strong id="last-move">—</strong></div>
        <div class="rules"><h3 data-i18n="howTo">怎么玩</h3><p data-i18n="rules">先选择棋子，再点击落点。圆点表示可走位置，圆环表示可吃的棋子。红方先行，将死或困毙对手获胜。</p><p data-i18n="repetition">长将、长捉与重复局面由完整棋规裁定。</p><p class="local" data-i18n="local">AI 在你的浏览器中运行。</p></div>
        <div class="credits"><a href="/xiangqi/LICENSE.txt">Pikafish · GPLv3</a><a id="rules-source" data-i18n="source">规则源码</a></div>
      </aside>
    </div>
  </main>
</body>
</html>
