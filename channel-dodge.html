<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>SkyZero · Dodge</title>
  <link rel="preload" href="fonts/Inter-Regular.woff2"  as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Manrope-Bold.woff2"  as="font" type="font/woff2" crossorigin>
  <script>
    // Reuse the same theme/lang prefs as the other game pages so the look
    // stays consistent across the whole site.
    (function(){
      try {
        var saved = localStorage.getItem('skz_theme');
        var mode = (saved === 'light' || saved === 'dark') ? saved : 'auto';
        var resolved = (mode === 'auto')
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themeMode = mode;
      } catch(e) {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.dataset.themeMode = 'auto';
      }
    })();
    (function(){
      try {
        var lang = localStorage.getItem('skz_lang');
        if (lang !== 'zh' && lang !== 'en') lang = 'zh';
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      } catch(e) {
        document.documentElement.lang = 'zh-CN';
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=20260907">
  <!-- Pin the leaderboard to dodge so the 2048 board doesn't show here. -->
  <script>window.SKZ_LB_GAME = 'dodge';</script>
  <script defer src="/leaderboard.js?v=20260703"></script>
  <link rel="stylesheet" href="channel-dodge.css?v=20260907">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <a class="brand-title" href="/" title="返回首页" id="brand_link"><span class="brand-wm"><span class="bw-sky">Sky</span><span class="bw-zero">Zero</span></span><span class="brand-suffix"> · Dodge</span></a>
      </div>
    </header>

    <div class="cd-app">
      <div class="cd-scores">
        <div class="cd-score">
          <div class="cd-score-label" id="lbl_score">分数</div>
          <div class="cd-score-value" id="score">0</div>
        </div>
        <div class="cd-score">
          <div class="cd-score-label" id="lbl_best">最高分</div>
          <div class="cd-score-value" id="best">0</div>
        </div>
      </div>

      <div class="cd-actions">
        <button class="btn primary" id="start_btn">开始</button>
        <button class="btn" id="pause_btn" disabled>暂停</button>
        <button class="btn" id="ai_btn" aria-pressed="false"><span class="brand-wm"><span class="bw-sky">Sky</span><span class="bw-zero">Zero</span></span> 接管</button>
      </div>
      <div class="cd-hint" id="ai_hint" hidden>本局由 <span class="brand-wm"><span class="bw-sky">Sky</span><span class="bw-zero">Zero</span></span> 接管,未计入排行榜</div>

      <div class="cd-stage" id="stage" tabindex="0" aria-label="Channel Dodge arena">
        <canvas class="cd-canvas" id="canvas"></canvas>
        <div class="cd-hp"><div class="cd-hp-fill" id="hp_fill"></div></div>
        <div class="cd-time" id="time">0.0s</div>
        <div class="cd-overlay show" id="overlay">
          <div class="cd-overlay-title" id="overlay_title">躲避 Channel Dodge</div>
          <div class="cd-overlay-sub" id="overlay_sub"></div>
          <div class="cd-overlay-stats" id="overlay_stats" hidden></div>
          <button class="btn primary" id="overlay_btn">开始</button>
        </div>
      </div>

      <!-- Touch-only joystick. Sits between the arena and the legend so a thumb
           never covers the play field. Shown only on coarse-pointer (touch)
           devices. -->
      <div class="cd-joystick" id="joystick" aria-hidden="true">
        <div class="cd-joystick-base" id="joy_base">
          <div class="cd-joystick-knob" id="joy_knob"></div>
        </div>
        <div class="cd-joystick-tip" id="joy_tip">按住拖动</div>
      </div>

      <div class="cd-legend">
        <div class="cd-legend-title" id="legend_title">弹幕类型 · 得分</div>
        <div class="cd-legend-row">
          <span class="cd-legend-swatch" style="background:#38bdf8;box-shadow:0 0 8px #38bdf8"></span>
          <span class="cd-legend-name" id="lg_bullet">子弹</span>
          <span class="cd-legend-pts">+1</span>
        </div>
        <div class="cd-legend-row">
          <span class="cd-legend-swatch" style="background:#4ade80;box-shadow:0 0 8px #4ade80"></span>
          <span class="cd-legend-name" id="lg_split">分裂弹</span>
          <span class="cd-legend-pts">+1</span>
        </div>
        <div class="cd-legend-row">
          <span class="cd-legend-swatch" style="background:#fb923c;box-shadow:0 0 8px #fb923c"></span>
          <span class="cd-legend-name" id="lg_aimed">追踪弹</span>
          <span class="cd-legend-pts">+2</span>
        </div>
        <div class="cd-legend-row">
          <span class="cd-legend-swatch" style="width:22px;height:22px;background:#a78bfa;box-shadow:0 0 8px #a78bfa"></span>
          <span class="cd-legend-name" id="lg_cannon">炮弹</span>
          <span class="cd-legend-pts">+3</span>
        </div>
        <div class="cd-legend-row">
          <span class="cd-legend-swatch" style="background:#facc15;box-shadow:0 0 8px #facc15"></span>
          <span class="cd-legend-name" id="lg_bomb">炸弹</span>
          <span class="cd-legend-pts">+4</span>
        </div>
        <div class="cd-legend-row">
          <span class="cd-legend-swatch laser" style="background:#f43f5e;box-shadow:0 0 8px #f43f5e"></span>
          <span class="cd-legend-name" id="lg_laser">激光</span>
          <span class="cd-legend-pts">+5</span>
        </div>
        <div class="cd-legend-row">
          <span class="cd-legend-swatch" style="background:#22c55e;border-radius:4px;box-shadow:0 0 8px #22c55e"></span>
          <span class="cd-legend-name" id="lg_heal">血包</span>
          <span class="cd-legend-pts" style="color:#22c55e">+25 HP</span>
        </div>
      </div>

      <div class="cd-roster">
        <button class="cd-roster-toggle" id="roster_toggle" aria-expanded="false" aria-controls="roster_body">
          <span id="roster_label">形象</span>
          <span class="cd-roster-current" id="roster_current"></span>
          <svg class="chev" width="12" height="12" viewBox="0 0 16 16" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6l4 4 4-4"></path>
          </svg>
        </button>
        <div class="cd-roster-body" id="roster_body" hidden>
          <div class="cd-avatar-grid" id="avatar_grid"></div>
          <button class="btn" id="draw_btn">自绘形象</button>
        </div>
      </div>

      <div class="cd-hint" id="hint">WASD / 方向键移动 · 手机上用下方摇杆 · 躲过的弹幕越多得分越高</div>
    </div>

    <!-- Draw-your-own avatar modal -->
    <div class="cd-draw" id="draw_modal" role="dialog" aria-modal="true" aria-labelledby="draw_title" hidden>
      <div class="cd-draw-panel">
        <div class="cd-draw-title" id="draw_title">画一个形象</div>
        <div class="cd-draw-stage">
          <canvas class="cd-draw-canvas" id="draw_canvas" width="232" height="232"></canvas>
          <div class="cd-draw-side">
            <canvas class="cd-draw-preview" id="draw_preview" width="56" height="56"></canvas>
            <div class="cd-draw-preview-label" id="draw_preview_label">预览</div>
          </div>
        </div>
        <div class="cd-draw-palette" id="draw_palette"></div>
        <div class="cd-draw-sizes" id="draw_sizes"></div>
        <div class="cd-draw-actions">
          <button class="btn" id="draw_clear">清空</button>
          <button class="btn" id="draw_cancel">取消</button>
          <button class="btn primary" id="draw_use">使用</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Trained autopilot weights (tiny MLP, pure-JS forward pass below). Exported from
       ../DodgeSAC by tools/export_dodge_sac.py (continuous SAC). Bump ?v= each retrain. -->
  <script src="dodge-policy.js?v=sac_t4b"></script>
  <script src="dodge-ai.js?v=20260907"></script>
  <script src="channel-dodge.js?v=20260907"></script>
</body>
</html>
